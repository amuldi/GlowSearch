services:
  - type: web
    name: glowsearch-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: GLOWSEARCH_CACHE_TTL_SECONDS
        value: 180
      - key: GLOWSEARCH_SOURCE_TIME_BUDGET_SECONDS
        value: 2.5
      - key: GLOWSEARCH_LIVE_COLLECT_DEADLINE_SECONDS
        value: 7.0
      - key: GLOWSEARCH_LIVE_FIRST_RESULT_GRACE_SECONDS
        value: 0.8
      - key: GLOWSEARCH_BACKGROUND_COLLECT_DEADLINE_SECONDS
        value: 90.0
      - key: GLOWSEARCH_MANAGED_SCRAPING_TIME_BUDGET_SECONDS
        value: 4.0
      - key: GLOWSEARCH_MUSINSA_API_ENABLED
        value: false
      - key: GLOWSEARCH_MUSINSA_API_BASE_URL
        sync: false
      - key: GLOWSEARCH_MUSINSA_API_TIMEOUT_SECONDS
        value: 3.0
      - key: GLOWSEARCH_OLIVEYOUNG_GLOBAL_API_ENABLED
        value: false
      - key: GLOWSEARCH_OLIVEYOUNG_GLOBAL_API_BASE_URL
        sync: false
      - key: GLOWSEARCH_OLIVEYOUNG_GLOBAL_API_TIMEOUT_SECONDS
        value: 3.0
      - key: GLOWSEARCH_OFFICIAL_BRAND_API_ENABLED
        value: false
      - key: GLOWSEARCH_OFFICIAL_BRAND_API_BASE_URL
        sync: false
      - key: GLOWSEARCH_OFFICIAL_BRAND_API_TIMEOUT_SECONDS
        value: 3.0
      - key: GLOWSEARCH_RESULT_SOURCE_PREFIXES
        value: oliveyoung,oliveyoung-global,official,musinsa,coupang,hwahae,glowpick,fudejapan,managed,barcode,discovery,external
      - key: GLOWSEARCH_DETAIL_ENRICHMENT_ENABLED
        value: false
      - key: GLOWSEARCH_MAX_RESULTS
        value: 480
      - key: GLOWSEARCH_OLIVEYOUNG_OFFICIAL_ORDER_ENABLED
        value: true
      - key: GLOWSEARCH_OLIVEYOUNG_LIVE_SEARCH_REQUIRED
        value: false
      - key: GLOWSEARCH_OLIVEYOUNG_PUBLIC_API_ENABLED
        value: true
      - key: GLOWSEARCH_OLIVEYOUNG_PUBLIC_API_BASE_URL
        value: https://mcp.aka.page
      - key: GLOWSEARCH_OLIVEYOUNG_PUBLIC_API_TIMEOUT_SECONDS
        value: 6.0
      - key: GLOWSEARCH_OLIVEYOUNG_PUBLIC_API_RETRY_ATTEMPTS
        value: 2
      - key: GLOWSEARCH_OLIVEYOUNG_PUBLIC_API_RETRY_BASE_DELAY_SECONDS
        value: 0.5
      - key: GLOWSEARCH_OLIVEYOUNG_PUBLIC_API_RETRY_MAX_DELAY_SECONDS
        value: 4.0
      - key: GLOWSEARCH_OLIVEYOUNG_PUBLIC_API_RATE_LIMIT_PER_SECOND
        value: 2.0
      - key: GLOWSEARCH_BRAND_SHOPIFY_ENABLED
        value: true
      - key: GLOWSEARCH_OLIVEYOUNG_SEARCH_MAX_PAGES
        value: 25
      - key: GLOWSEARCH_OLIVEYOUNG_HTML_COLLECTOR_ENABLED
        value: false
      - key: GLOWSEARCH_BROWSER_COLLECTOR_ENABLED
        value: false
      - key: GLOWSEARCH_BROWSER_HEADLESS
        value: true
      - key: GLOWSEARCH_BROWSER_TIMEOUT_SECONDS
        value: 8
      - key: GLOWSEARCH_PRODUCT_INDEX_ENABLED
        value: true
      - key: GLOWSEARCH_PRODUCT_INDEX_PATH
        value: /var/data/product_index.sqlite3
      - key: GLOWSEARCH_PRODUCT_INDEX_ADMIN_TOKEN
        sync: false
      - key: GLOWSEARCH_TURSO_DATABASE_URL
        sync: false
      - key: GLOWSEARCH_TURSO_AUTH_TOKEN
        sync: false
      - key: GLOWSEARCH_TURSO_SYNC_INTERVAL_SECONDS
        value: 300
      - key: GLOWSEARCH_PRODUCT_INDEX_MIN_RESULTS
        value: 1
      - key: GLOWSEARCH_PRODUCT_INDEX_BACKGROUND_REFRESH_ENABLED
        value: true
      - key: GLOWSEARCH_PRODUCT_INDEX_BACKGROUND_REFRESH_LIMIT
        value: 1200
      - key: GLOWSEARCH_PRODUCT_INDEX_WARMUP_ON_STARTUP
        value: true
      - key: GLOWSEARCH_PRODUCT_INDEX_VERIFIED_CATALOG_BACKFILL_ON_STARTUP
        value: true
      - key: GLOWSEARCH_PRODUCT_INDEX_WARMUP_LIMIT
        value: 1200
      - key: GLOWSEARCH_PRODUCT_INDEX_WARMUP_CONCURRENCY
        value: 4
      - key: GLOWSEARCH_PRODUCT_INDEX_MAX_SEED_QUERIES
        value: 500
      - key: GLOWSEARCH_PRODUCT_INDEX_BRAND_REGISTRY_WARMUP_ENABLED
        value: true
      - key: GLOWSEARCH_PRODUCT_INDEX_BRAND_REGISTRY_WARMUP_LIMIT
        value: 300
      - key: GLOWSEARCH_PRODUCT_INDEX_DETAIL_ENRICHMENT_ENABLED
        value: true
      - key: GLOWSEARCH_PRODUCT_INDEX_DETAIL_ENRICHMENT_MAX_RECORDS
        value: 12
      - key: GLOWSEARCH_CORS_ORIGINS
        value: http://localhost:3000,https://glow-search.vercel.app,https://frontend-plum-six-32.vercel.app
